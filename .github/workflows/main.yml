name: CI

permissions:
  contents: read

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: 

jobs:
  format:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        go-version: [1.12, 1.16]
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Environment
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{matrix.go-version}}

      - name: Format Validation
        shell: bash
        id: format-validation
        run: test -z "$(gofmt -l .)"
        
      - name: Job Result
        if: ${{steps.format-validation.outcome == 'success'}}
        run: echo "gofmt no necesita cambios → ✅"

      - name: Job Result  
        if: ${{always() && steps.format-validation.outcome == 'failure'}}
        run: echo "gofmt necesario → ❌"
        
  dependencies:
    runs-on: ${{matrix.os}}
    needs: [ format ]
    strategy:
      matrix:
        go-version: [1.12, 1.16]
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Environment
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{matrix.go-version}}

      - name: Check Dependencies
        id: check-dependencies
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Job Result
        if: ${{steps.check-dependencies.outcome == 'success'}}
        run: echo "repositorio correctamente tidy → ✅"

      - name: Job Result
        if: ${{always() && steps.check-dependencies.outcome == 'failure'}}
        run: echo "diferencias después de tidy → ❌"
        
  analysis:
    runs-on: ${{matrix.os}}
    needs: [ dependencies ]
    strategy:
      matrix:
        go-version: [1.12, 1.16]
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Environment
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{matrix.go-version}}

      - name: Check Code Errors
        id: check-code-errors
        run: go vet ./...

      - name: Job Result
        if: ${{steps.check-code-errors.outcome == 'success'}}
        run: echo "vet check success -> ✅"

      - name: Job Result
        if: ${{always() && steps.check-code-errors.outcome == 'failure'}}
        run: echo "vet check failure -> ❌"
  
  test:
    runs-on: ${{matrix.os}}
    needs: [ analysis ]
    strategy:
      matrix:
        go-version: [1.12, 1.16]
        os: [ubuntu-latest, windows-latest]
        os-short: [ubuntu, windows]
        include:
          - single-exec: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Environment
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{matrix.go-version}}

      - name: Create Coverage Folder
        if: ${{matrix.single-exec == true}}
        run: mkdir -p coverage

      - name: Test Execution
        run: go test ./... -coverprofile=coverage/coverage-${{matrix.os-short}}.out

      - name: Upload Coverage Artifact
        if: ${{matrix.single-exec == true}}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test
          path: coverage/

  build:
    runs-on: ${{matrix.os}}
    needs: [ test ]
    strategy:
      matrix:
        go-version: [1.12, 1.16]
        os: [ubuntu-latest, windows-latest]
        os-short: [ubuntu, windows]
        include:
          - single-exec: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Environment
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{matrix.go-version}}

      - name: Generate Build
        id: build
        run: go build ./...

      - name: Summary
        run: echo "${{matrix.os}} + Go ${{matrix.go-version}} -> ${{steps.build.outcome}}" >> $GITHUB_STEP_SUMMARY


          
